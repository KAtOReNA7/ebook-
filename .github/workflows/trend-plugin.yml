name: Trend plugin static site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/trend-plugin/**', '.github/workflows/trend-plugin.yml']
permissions:
  contents: read
concurrency:
  group: trend-plugin-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/trend-plugin/package-lock.json
      - run: npm ci --prefix web/trend-plugin --ignore-scripts
      - run: npm test --prefix web/trend-plugin
      - run: npm run build --prefix web/trend-plugin
      - run: python tools/package_trend_hosted.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/trend-plugin/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static plugin
        id: deployment
        uses: actions/deploy-pages@v4
